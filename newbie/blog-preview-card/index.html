<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Frontend Mentor | Blog Preview Card</title>
    <link rel="shortcut icon" href="./assets/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./reset.css"/>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
    <div class="card">
        <div class="card__image">
            <img src="./assets/images/illustration-article.svg" alt="" class="card__image-inner">
        </div>
        <div class="card__content">
            <div class="card__badges">
                <span class="card__badge">Learning</span>
            </div>
            <p class="card__date">Published 21 Dec 2023</p>
            <h1 class="card__title">HTML & CSS foundations</h1>
            <p class="card__description">
                These languages are the backbone of every website, defining structure, content,
                and presentation.
            </p>
        </div>
        <div class="card__author">
            <img src="./assets/images/image-avatar.webp" alt="" class="card__author-image"/>
            <h4 class="card__author-name">Greg Hooper</h4>
        </div>
    </div>
</body>
</html>
